name: Java CI

on:
  push:
    branches:
      - master
    paths:
      - 'pipeline-samples/java-app/**'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile
        run: |
          cd pipeline-samples/java-app
          javac Main.java

      - name: Run
        run: |
          cd pipeline-samples/java-app
          java Main
