name: Python CI

on:
  push:
    paths:
      - 'pipeline-samples/python-app/**'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd pipeline-samples/python-app
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd pipeline-samples/python-app
          pytest test_app.py -v