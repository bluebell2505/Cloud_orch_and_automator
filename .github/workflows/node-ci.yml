name: Node CI

on:
  push:
    branches:
      - master
    paths:
      - 'pipeline-samples/node-app/**'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd pipeline-samples/node-app
          npm install

      - name: Run app
        run: |
          cd pipeline-samples/node-app
          npm test
